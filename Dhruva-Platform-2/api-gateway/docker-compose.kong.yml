version: '3.8'

services:
  # Kong Database (PostgreSQL)
  kong-database:
    image: postgres:15-alpine
    container_name: kong-database
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpassword
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - kong-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong Migration
  kong-migration:
    image: kong:latest
    container_name: kong-migration
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - kong-network
    restart: "no"

  # Kong API Gateway
  kong:
    image: kong:latest
    container_name: kong-gateway
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_STREAM_LISTEN: 0.0.0.0:8443
      KONG_PLUGINS: bundled,key-auth,rate-limiting,cors,request-transformer,response-transformer
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 100m
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 100m
    ports:
      - "8000:8000"   # Kong Proxy
      - "8001:8001"   # Kong Admin API
      - "8002:8002"   # Kong Manager
      - "8443:8443"   # Kong Stream
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    networks:
      - kong-network
    volumes:
      - ./kong-config:/opt/kong/kong.conf.d
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - kong
    networks:
      - kong-network
    restart: unless-stopped

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@yourdomain.com --agree-tos --no-eff-email -d yourdomain.com
    networks:
      - kong-network

  # Kong API Key Manager (Custom service to sync with your database)
  kong-api-manager:
    build:
      context: ./api-manager
      dockerfile: Dockerfile
    container_name: kong-api-manager
    environment:
      - MONGODB_URI=mongodb://dhruvaadmin:dhruva123@dhruva-platform-app-db:27017/admin?authSource=admin
      - KONG_ADMIN_URL=http://kong:8001
      - SYNC_INTERVAL=30
    depends_on:
      - kong
    networks:
      - kong-network
      - dhruva-network
    restart: unless-stopped

volumes:
  kong_data:

networks:
  kong-network:
    name: kong-network
    external: false
  dhruva-network:
    name: dhruva-network
    external: true
