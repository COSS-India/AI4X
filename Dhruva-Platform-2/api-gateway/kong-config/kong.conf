# Kong Configuration File

# Database
database = postgres
pg_host = kong-database
pg_port = 5432
pg_database = kong
pg_user = kong
pg_password = kongpassword

# Proxy
proxy_listen = 0.0.0.0:8000
proxy_listen_ssl = 0.0.0.0:8443

# Admin API
admin_listen = 0.0.0.0:8001
admin_gui_listen = 0.0.0.0:8002

# Logging
proxy_access_log = /dev/stdout
proxy_error_log = /dev/stderr
admin_access_log = /dev/stdout
admin_error_log = /dev/stderr

# Plugins
plugins = bundled,key-auth,rate-limiting,cors,request-transformer,response-transformer

# Nginx
nginx_http_client_body_buffer_size = 100m
nginx_http_client_max_body_size = 100m
nginx_proxy_proxy_buffer_size = 100k
nginx_proxy_proxy_buffers = 4 100k

# Real IP
real_ip_header = X-Real-IP
real_ip_recursive = on
trusted_ips = 0.0.0.0/0,::/0

# Rate Limiting
rate_limiting_redis_host = redis
rate_limiting_redis_port = 6379
rate_limiting_redis_password = 
rate_limiting_redis_database = 0
rate_limiting_redis_timeout = 2000

# CORS
cors_origins = *
cors_methods = GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS
cors_headers = Accept,Accept-Version,Content-Length,Content-MD5,Content-Type,Date,X-Auth-Token,Authorization,X-API-Key
cors_exposed_headers = X-Auth-Token,Authorization,X-API-Key
cors_credentials = true
cors_max_age = 3600
